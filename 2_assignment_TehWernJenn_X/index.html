  // popup size used for any link that doesn't set its own w/h
  let defaultWidth = 700;
  let defaultHeight = 700;

  function setup() {
    noCanvas(); // this page only places links, so we don't need a canvas
    textSize(50);
    for (let i = 0; i < links.length; i++) {
      let link = links[i];
      let a = createA('javascript:void(0)', link.label);
      a.position(link.x, link.y);
      a.mousePressed(() => openPopup(link));

      if (link.label === "X") {
      a.style('font-size', '800px'); // size font
      a.style('z-index', '-3'); // Keeps X behind everything else
    } else if (link.label === "Don't") {
      a.style('font-size', '30px'); 
      a.style('transform', 'rotate(236deg)'); // rotate 
    } else if (link.label === "Sing") {
      a.style('font-size', '50px'); 
    } else if (link.label === "Runaway") {
      a.style('font-size', '30px'); 
      a.style('transform', 'rotate(55deg)'); // rotate 
    } else if (link.label === "Take It Back") {
      a.style('font-size', '20px'); 
      a.style('transform', 'rotate(235deg)'); // rotate 
    }
  }
   
   
  }

  // opens a link in its own small popup window
  function openPopup(link) {
    let w = link.w || defaultWidth;
    let h = link.h || defaultHeight;
    window.open(
      link.url,
      '_blank',
      `width=${w},height=${h},left=100,top=50,resizable=yes,scrollbars=yes`
    );
  }
